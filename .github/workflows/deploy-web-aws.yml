name: Deploy Web App to AWS (S3 + CloudFront)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Production Bundle
        run: npm run build -- --configuration production

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}

      - name: Deploy to AWS S3 Bucket
        env:
          TARGET_BUCKET: ${{ secrets.AWS_S3_BUCKET || secrets.BUCKETNAME }}
        run: |
          aws s3 sync dist/churchwebsite s3://${TARGET_BUCKET} --delete --cache-control "public, max-age=31536000, immutable" --exclude "index.html"
          aws s3 cp dist/churchwebsite/index.html s3://${TARGET_BUCKET}/index.html --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront Cache (Optional)
        env:
          CF_DIST_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -n "$CF_DIST_ID" ]; then
            echo "Invalidating CloudFront cache for distribution: $CF_DIST_ID"
            aws cloudfront create-invalidation --distribution-id "$CF_DIST_ID" --paths "/*"
          else
            echo "No CloudFront distribution ID configured. Skipping cache invalidation."
          fi
