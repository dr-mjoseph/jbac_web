name: Deploy Web App to AWS (S3 + CloudFront + Lambda Backend)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}

      - name: Deploy Backend to AWS Lambda & API Gateway
        id: deploy_backend
        run: |
          chmod +x scripts/deploy_aws_backend.sh
          ./scripts/deploy_aws_backend.sh

      - name: Update Environment with Live AWS Backend URLs
        run: node scripts/inject_backend_url.js

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Production Bundle
        run: npm run build -- --configuration production

      - name: Provision / Verify CloudFront HTTPS CDN
        env:
          TARGET_BUCKET: ${{ secrets.AWS_S3_BUCKET || secrets.BUCKETNAME }}
        run: |
          chmod +x scripts/deploy_cloudfront.sh
          ./scripts/deploy_cloudfront.sh

      - name: Deploy to AWS S3 Bucket
        env:
          TARGET_BUCKET: ${{ secrets.AWS_S3_BUCKET || secrets.BUCKETNAME }}
        run: |
          aws s3 sync dist/churchwebsite s3://${TARGET_BUCKET} --delete --cache-control "public, max-age=31536000, immutable" --exclude "index.html"
          aws s3 cp dist/churchwebsite/index.html s3://${TARGET_BUCKET}/index.html --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront Cache
        env:
          CF_DIST_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID || env.CF_DIST_ID }}
        run: |
          if [ -n "$CF_DIST_ID" ] && [ "$CF_DIST_ID" != "None" ]; then
            echo "Invalidating CloudFront cache for distribution: $CF_DIST_ID"
            aws cloudfront create-invalidation --distribution-id "$CF_DIST_ID" --paths "/*" || true
          else
            echo "No CloudFront distribution ID configured. Skipping cache invalidation."
          fi

      - name: Commit & Push Deployed AWS Config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f src/environments/environment.prod.ts src/environments/environment.ts backend_url.txt cloudfront_url.txt diagnostics.txt || true
          git diff --staged --quiet || (git commit -m "chore: connect frontend to AWS Lambda backend API [skip ci]" && git pull --rebase origin main && git push origin main) || true

