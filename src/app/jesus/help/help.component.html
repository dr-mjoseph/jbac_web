<div
    class="page body_style_wide body_filled article_style_stretch scheme_original top_panel_show top_panel_above sidebar_hide">
    <a id="toc_home" class="sc_anchor" title="Home"
        data-description="<i>Return to Home</i> - <br>navigate to home page of the site" data-icon="icon-home"
        data-url="index.html" data-separator="yes"></a>
    <a id="toc_top" class="sc_anchor" title="To Top"
        data-description="<i>Back to top</i> - <br>scroll to top of the page" data-icon="icon-double-up" data-url=""
        data-separator="yes"></a>
    <br>
    <div class="latest-news-block" style="background-color:#ccc">
        <div class="latest-news-block-hightlight">
            <div class="latest-update-block"> <span class="block-2"> Updates </span>
                <div style="overflow:hidden">
                    <marquee behavior="scroll" direction="left" scrolldelay="15" scrollamount="1" truespeed="10"
                        onmouseover="this.stop()" onmouseout="this.start()" style="height:30px; white-space: nowrap">

                        <div class="tickercontainer">
                            <span
                                class="ad-blk">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Ads:</span>
                            <a href="https://jbac.in">jbac.in
                                Updates</a>

                            <span
                                class="photo_gallery-icon">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Photo
                                Gallery:&nbsp;</span>
                            <a href="/gallery">Update Gallery</a>


                            <span
                                class="polls-icon">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Poll:&nbsp;</span>
                            <a href="/church_timings">Are You Search
                                Church Timings</a>
                        </div>
                    </marquee>
                </div>
            </div>
        </div>
    </div>

    <section class="gradient-custom">
        <div class="container py-4 h-100">
            <div class="row">
                <!-- Left Column: Help Request Form -->
                <div class="col-lg-8 mb-4">
                    <div class="card shadow-sm border-0" style="border-radius: 12px;">
                        <div class="card-body p-4">
                            <div class="d-flex align-items-center mb-4 pb-2 border-bottom">
                                <h3 class="m-0 text-primary"><b>సహాయం కోరండి</b></h3>
                            </div>
                            <form [formGroup]="addinghelp">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">పేరు <span class="text-danger">*</span></label>
                                        <input type="text" formControlName="name" class="form-control"
                                            placeholder="మీ పూర్తి పేరు నమోదు చేయండి" />
                                    </div>

                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">మొబైల్ నంబర్ <span class="text-danger">*</span></label>
                                        <input type="tel" maxlength="10" formControlName="mobile_number" class="form-control"
                                            placeholder="10 అంకెల మొబైల్ నంబర్" />
                                    </div>

                                    <div class="col-md-12 mb-3">
                                        <label class="form-label fw-bold">చిరునామా <span class="text-danger">*</span></label>
                                        <textarea formControlName="address" class="form-control" rows="2"
                                            placeholder="గ్రామం/పట్టణం, మండలం, జిల్లా మొదలైన పూర్తి చిరునామా"></textarea>
                                    </div>

                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">సహాయం రకం <span class="text-danger">*</span></label>
                                        <select class="form-control" formControlName="help">
                                            <option value="" selected disabled>సహాయం రకాన్ని ఎంచుకోండి</option>
                                            <option value="CommunitySupport Help">కమ్యూనిటీ సహాయం</option>
                                            <option value="Education Help">విద్య సహాయం</option>
                                            <option value="Financial Help">ఆర్థిక సహాయం</option>
                                            <option value="ForChurchConstruction Help">చర్చి నిర్మాణం కొరకు సహాయం</option>
                                            <option value="Legal Help">న్యాయ సహాయం</option>
                                            <option value="Medical Help">వైద్య సహాయం</option>
                                            <option value="PoliceDepartmental Help">పోలీస్ డిపార్ట్‌మెంట్ సహాయం</option>
                                            <option value="Political Help">రాజకీయ సహాయం</option>
                                            <option value="Other Help">ఇతర సహాయం</option>
                                        </select>
                                    </div>

                                    <div class="col-md-6 mb-3">
                                        <label for="formFile" class="form-label fw-bold">చిత్రం అప్‌లోడ్ (ఐచ్ఛికం)</label>
                                        <input class="form-control" type="file" id="formFile" accept="image/x-png,image/jpeg"
                                            formControlName="image" (change)="onImageChange($event)" />
                                        <div class="mt-2" *ngIf="imagesData.length">
                                            <img [src]="imagesData[0].reviewimg" alt="Uploaded Preview" height="80px" class="rounded border">
                                        </div>
                                    </div>

                                    <div class="col-md-12 mb-3">
                                        <label class="form-label fw-bold">సహాయ వివరాలు / వివరణ <span class="text-danger">*</span></label>
                                        <textarea formControlName="description" class="form-control" rows="3"
                                            placeholder="మీకు అవసరమైన సహాయం గురించి వివరంగా తెలపండి"></textarea>
                                    </div>

                                    <div class="col-md-12 text-center mt-3">
                                        <button type="button" class="default-btn user-all-btn px-5 py-2 fs-6 fw-bold"
                                            (click)="postmeetings()">
                                            సమర్పించండి
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Scrolling Ads -->
                <div class="col-lg-4 mb-4">
                    <div class="news-sidebar-card shadow-sm p-3 bg-white" style="border-radius: 12px;">
                        <h5 class="fw-bold text-center text-primary mb-3 border-bottom pb-2">
                            <i class="fa fa-bullhorn me-1"></i> ప్రకటనలు / సమాచారం
                        </h5>
                        <marquee onmouseover="this.stop();" onmouseout="this.start();" direction="up"
                            style="height: 550px; scroll-behavior: smooth;">
                            <div class="sidebar-ad-card mb-3 p-3 text-center border rounded bg-white">
                                <h5 class="fw-bold text-success mb-1">Welcome To JBAC.IN</h5>
                                <p class="small text-muted mb-0">ఆంధ్ర & తెలంగాణ క్రైస్తవ సేవా సమాచారం</p>
                            </div>
                            <div *ngFor="let item of adds" class="sidebar-ad-card mb-3 p-2 border rounded shadow-sm bg-white">
                                <img [src]="item.image || 'assets/images/user.jpg'" (error)="$any($event.target).src = 'assets/images/user.jpg'"
                                    (click)="openimg(item.image, openmodel)"
                                    class="img-fluid rounded mb-2 ad-img cursor-pointer"
                                    style="width: 100%; max-height: 220px; object-fit: cover;"
                                    alt="Advertisement">
                                <p class="small text-dark mb-0 fw-semibold px-1">
                                    {{item.description}}
                                </p>
                            </div>
                        </marquee>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>

<!-- //////image popup_code //////////////////////// -->
<ng-template #openmodel let-modal>
    <div class="modal-header">
        <h5 class="modal-title mt-0 ">Image</h5>
        <button type="button" class="close" aria-hidden="true" (click)="proofmodalDismis()">×</button>
    </div>

    <img src={{image}}>

</ng-template>

<div class="my-overlay" *ngIf="showSpinner">
    <div class="cusloader"></div>
    <h5 style="color: white;">Please Wait...</h5>
</div>
