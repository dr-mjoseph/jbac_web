<!-- Breadcrumbs Header -->
<div class="top_panel_title top_panel_style_3 title_present breadcrumbs_present scheme_original">
    <div class="top_panel_title_inner inner-bg6">
        <div class="content_wrap">
            <h1 class="page_title">ఫోటో గ్యాలరీ (Photo Gallery)</h1>
        </div>
    </div>
</div>

<div class="page body_style_wide body_filled article_style_stretch scheme_original top_panel_show top_panel_above sidebar_hide">
    <a id="toc_home" class="sc_anchor" title="Home"
        data-description="<i>Return to Home</i> - <br>navigate to home page of the site" data-icon="icon-home"
        data-url="index.html" data-separator="yes"></a>
    <a id="toc_top" class="sc_anchor" title="To Top"
        data-description="<i>Back to top</i> - <br>scroll to top of the page" data-icon="icon-double-up" data-url=""
        data-separator="yes"></a>

    <div class="container py-5">
        <div class="text-center mb-4">
            <h3 class="gallery-heading fw-bold">గ్యాలరీ కేటగిరీలు (Gallery Categories)</h3>
            <p class="text-muted">వివిధ విభాగాల ఫోటో ఆల్బమ్‌లు చూడడానికి ఏదైనా కేటగిరీని ఎంచుకోండి</p>
        </div>

        <!-- Categories Grid -->
        <div class="row g-4 justify-content-center">
            <div class="col-12 col-sm-6 col-md-4 col-lg-3 d-flex align-items-stretch"
                *ngFor="let item of imagesget | paginate: { itemsPerPage: 12, currentPage: page }">
                <a [routerLink]="['/subgallery', item.id]" class="gallery-category-card card shadow-sm border-0 w-100 text-decoration-none">
                    <div class="gallery-thumb-wrap position-relative">
                        <img [src]="item.image || 'assets/images/gallery.png'"
                            (error)="onImageError($event)"
                            class="gallery-thumbnail"
                            [alt]="item.categoryname || 'Gallery Category'">
                        <span class="gallery-album-badge">
                            <i class="fa fa-folder-open me-1"></i> ఆల్బమ్
                        </span>
                    </div>

                    <div class="card-body p-3 text-center d-flex flex-column justify-content-between">
                        <h5 class="category-name fw-bold mb-2">{{item.categoryname || 'గ్యాలరీ ఆల్బమ్'}}</h5>
                        <div class="view-album-action text-primary small fw-semibold">
                            ఫోటోలు చూడండి <i class="fa fa-arrow-circle-right ms-1"></i>
                        </div>
                    </div>
                </a>
            </div>

            <!-- Empty State -->
            <div class="col-12 text-center py-5" *ngIf="!imagesget || imagesget.length === 0">
                <div class="alert alert-info d-inline-block shadow-sm p-4">
                    <i class="fa fa-info-circle me-2"></i> గ్యాలరీ కేటగిరీలు ఏవీ అందుబాటులో లేవు.
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <div class="col-lg-12 text-center mt-5" *ngIf="imagesget && imagesget.length > 12">
            <div class="pagination justify-content-center">
                <pagination-controls (pageChange)="page = $event" previousLabel="<" nextLabel=">">
                </pagination-controls>
            </div>
        </div>
    </div>
</div>
